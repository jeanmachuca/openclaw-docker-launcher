services:
  openclaw:
    env_file:
      - .env
    profiles:
      - openclaw
    networks:
      - openclaw-network
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_GIT_URL: ${OPENCLAW_GIT_URL:-https://github.com/openclaw/openclaw.git}
        OPENCLAW_GIT_REF: ${OPENCLAW_GIT_REF:-main}
    image: openclaw-docker-sandbox:latest
    container_name: openclaw-sandbox
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    # Persist CLI onboarding, credentials, and local state under the openclaw user
    volumes:
      - openclaw_home:/home/openclaw
    restart: unless-stopped
    init: true

volumes:
  openclaw_home:
networks:
  openclaw-network:
    driver: bridge